name: Daily AI Blog Auto-Posting

on:
  schedule:
    # 00:15 UTC = 09:15 KST (시사·경제)
    - cron: '15 0 * * *'
    # 03:15 UTC = 12:15 KST (부동산)
    - cron: '15 3 * * *'
    # 07:15 UTC = 16:15 KST (재테크·금융)
    - cron: '15 7 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: '포스팅할 카테고리 선택'
        required: false
        default: 'auto'
      postId:
        description: '수정할 Post ID (비워두면 신규 생성)'
        required: false
        default: ''
      userFeedback:
        description: '사용자 수정 지시사항'
        required: false
        default: ''

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 파이프라인 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WP_SITE_ID: ${{ secrets.WP_SITE_ID }}
          WP_ACCESS_TOKEN: ${{ secrets.WP_ACCESS_TOKEN }}
          WP_BLOG_URL: ${{ secrets.WP_BLOG_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          CATEGORY: ${{ github.event.inputs.category }}
          REVISE_POST_ID: ${{ github.event.inputs.postId }}
          USER_FEEDBACK: ${{ github.event.inputs.userFeedback }}
        run: |
          ARGS=""
          if [ -n "$CATEGORY" ] && [ "$CATEGORY" != "auto" ]; then
            ARGS="$ARGS --category=$CATEGORY"
          fi
          if [ -n "$REVISE_POST_ID" ]; then
            ARGS="$ARGS --post-id=\"$REVISE_POST_ID\""
          fi
          if [ -n "$USER_FEEDBACK" ]; then
            ARGS="$ARGS --feedback=\"$USER_FEEDBACK\""
          fi
          npm run pipeline -- $ARGS
